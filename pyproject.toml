    { name = "ngocthinh09", email = "volengocthinh09@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "datasets>=5.0.1",
    "ddgs>=9.16.0",
    "duckduckgo-search>=8.1.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "mcp[cli]>=2.1.1",
    "openai>=3.8.0",
    "qdrant-client>=1.19.0",
